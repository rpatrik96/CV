name: Build cv

on:
  push:
    branches:
      - main
  pull_request:
  registry_package:

jobs:
  build-template:
    name: Build cv
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/moderncv/debian-texlive-docker:main

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build pdf
        run: latexmk -pdflua ./cv.tex

      - name: Upload pdf
        uses: actions/upload-artifact@v7
        with:
          name: cv.pdf
          path: ./cv.pdf
          overwrite: true

      - name: Upload log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: cv.log
          path: ./cv.log
          overwrite: true

  deploy:
    needs: [build-template]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Downloaded straight into the published layout: the site's
      # navigation.yml links to /CV/github_artifacts/cv.pdf, so that
      # directory name is part of the public URL and must not change.
      - name: Collect artifacts
        uses: actions/download-artifact@v8
        with:
          path: github_deploy/github_artifacts
          merge-multiple: true

      - name: Deploy on orphan branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./github_deploy
          publish_branch: build
          force_orphan: true
          enable_jekyll: true
